<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Market Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <h1>💰 Crypto Market Dashboard</h1>

        <!-- Dark / Light mode -->
        <button id="themeBtn">🌙 Dark / Light</button>

        <!-- Search + Currency -->
        <div class="search-box">
            <input 
                type="text" 
                id="cryptoInput" 
                placeholder="Ex: bitcoin, btc, eth, usdt..."
            >

            <select id="currencySelect">
                <option value="usd">USD ($)</option>
                <option value="eur">EUR (€)</option>
                <option value="mad">MAD (DH)</option>
            </select>

            <button id="searchBtn">Rechercher</button>
        </div>

        <!-- Top Coins -->
        <div id="topCoins" class="top-coins"></div>

        <!-- Infos Card -->
        <div class="card">
            <h2 id="name">Nom : --</h2>
            <p>💰 <strong>Prix :</strong> <span id="price">--</span></p>
            <p>📈 <strong>Variation 24h :</strong> <span id="change">--</span></p>
            <p>🏆 <strong>Market Cap :</strong> <span id="marketcap">--</span></p>
        </div>

        <!-- Chart -->
        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

    <!-- JS -->
    <script src="script.js"></script>
</body>
</html>
